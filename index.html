<style>
:root{--t:#29B5BD;--td:#0E7C86;--g:#C2A16B;--gd:#8A6D3B;--n:#1F2A3C;--bg:#F5F8F9}*{box-sizing:border-box}
body{margin:0;font:16px/1.5 Inter,system-ui,Segoe UI,Arial,sans-serif;color:var(--n);background:var(--bg)}
header{background:#fff;border-bottom:4px solid var(--g);padding:10px 16px;display:flex;gap:12px;align-items:center;flex-wrap:wrap}
.logo{width:44px;height:44px;border-radius:10px}header b{font-size:15px}header small{display:block;font-weight:400;color:#556;font-size:12px}#st{margin-left:auto;font-size:13px;color:#556}
nav{background:#fff;border-bottom:1px solid #dde4e7;padding:8px 12px;display:flex;gap:6px;overflow-x:auto;position:sticky;top:0;z-index:5}
nav button{flex:none;border:1px solid #cfd8dc;background:#fff;border-radius:999px;padding:6px 12px;font-size:13px;cursor:pointer;color:var(--n)}nav button.on{background:var(--td);color:#fff;border-color:var(--td)}
main{max-width:900px;margin:0 auto;padding:16px}.card{background:#fff;border:1px solid #dde4e7;border-radius:14px;padding:16px;margin:0 0 16px;box-shadow:0 1px 2px #0001}
h1{font-size:22px;color:var(--td);border-bottom:2px solid var(--g);padding-bottom:6px}h2{font-size:19px;border-bottom:2px solid var(--g);padding-bottom:4px}h3{font-size:17px;margin:0;flex:1}
.qh{display:flex;gap:8px;align-items:flex-start;flex-wrap:wrap;margin-bottom:8px}.tag{background:#29b5bd26;color:var(--td);border-radius:6px;padding:1px 8px;font-weight:600;font-size:14px}
.chip{font-size:12px;border-radius:999px;padding:1px 8px;background:#eef1f3;color:#556}.chip.req{background:#fdecec;color:#b42318}
.f{margin:12px 0}.lb{display:block;font-size:14px;color:#445;margin-bottom:4px}.hint{display:block;color:#667;font-size:12px;flex-basis:100%}
input[type=text],input[type=date],input[type=email],input[type=number],textarea{width:100%;border:1px solid #b9c4ca;border-radius:8px;padding:9px 10px;font:inherit;background:#fff;color:var(--n)}
input:focus,textarea:focus{outline:2px solid var(--td)}.opts{display:flex;flex-wrap:wrap;gap:8px 18px}.opts label{display:flex;gap:6px;align-items:flex-start;font-size:15px}.opts input{margin-top:5px;accent-color:var(--td)}
.oth{max-width:260px}.rows{border:1px solid #dde4e7;border-radius:10px}.row{padding:10px 12px;border-bottom:1px solid #e6ecef}.row:last-child{border:0}.rl{font-weight:500;display:flex;gap:6px}
.cols{display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:10px;margin-top:8px}.entry{background:var(--bg);border:1px solid #dde4e7;border-radius:12px;padding:12px;margin-bottom:10px}.eh{display:flex;justify-content:space-between;color:var(--td);margin-bottom:6px}
.btn{border:0;background:var(--td);color:#fff;border-radius:10px;padding:10px 16px;font:inherit;font-weight:600;cursor:pointer}.btn.ghost{background:#fff;color:var(--td);border:1px solid var(--td)}.btn.dark{background:var(--n)}.lnk{background:none;border:0;color:#b42318;text-decoration:underline;cursor:pointer;font:inherit}
details{background:#c2a16b1a;border-radius:8px;padding:8px 12px;margin-bottom:8px;font-size:14px}summary{cursor:pointer;color:var(--gd);font-weight:600}dt{font-weight:600;margin-top:6px}dd{margin:0}
.msg{background:#fdecec;color:#8a1c14;border-radius:8px;padding:8px 12px;margin-top:10px;font-size:14px}.msg p{margin:2px 0}.na{display:block;margin:6px 0;font-size:14px}.bar{height:10px;background:#dde4e7;border-radius:99px;overflow:hidden}.bar i{display:block;height:100%;background:var(--t)}
.nav2{display:flex;justify-content:space-between;gap:8px;margin:8px 0 40px}.ok{background:#e8f6ee;color:#14532d;border-radius:8px;padding:10px 12px}.acts{display:flex;flex-wrap:wrap;gap:10px;margin-top:12px}.note{font-size:13px;color:#556}
@media print{header,nav,.nav2,.acts,details,.na,button{display:none!important}body{background:#fff}.card{box-shadow:none;break-inside:avoid}@page{size:A4;margin:14mm}}

<script>
const D={"sections":[["A","Unit Profile & Respondent"],["B","Scope of Service & Clinical Practice Gaps"],["C","Role Requirements, Mandatory Training & Professional Credentials"],["D","Competency Management"],["E","Documentation, Legal & Regulatory"],["F","Quality & Nurse-Sensitive Indicators"],["G","Professional Practice, Culture & RN Engagement"],["H","Evidence-Based Practice, Research & Innovation"],["I","Transition to Practice & Preceptorship"],["J","Learning Design, Delivery & NESD Services"],["K","Priorities & Further Suggestions"]],"aligned":{"A":"Magnet Organizational Overview (nursing workforce data) · PTAP practice-setting scope · NCPD target audience","B":"Magnet Exemplary Professional Practice (care delivery, scope of practice) · PTAP DD 5 (practice-setting curriculum) · NCPD EDP 1–EDP 2 (practice gap, evidence, underlying need)","C":"Magnet Structural Empowerment (professional development; BSN and certification goals) · PTAP OE 2 / DD 1 (scope and standards of practice) · NCPD EDP 3 (competencies from professional sources)","D":"Magnet Exemplary Professional Practice (competency & skills) · PTAP DD 1–DD 4 (competency evaluation, gap identification, remediation) · NCPD EDP 3, EDP 5 (competencies; assessment methods)","E":"Magnet Exemplary Professional Practice (ethics, standards, regulatory compliance) · PTAP PBL 8 (ethics) / DD 1 · NCPD EDP 1 (audit and quality evidence)","F":"Magnet Empirical Outcomes / Exemplary Professional Practice (nurse-sensitive clinical indicators) · PTAP PG/OM 1 (patient outcomes) · NCPD QO 1 and EDP 7 (expected results; summative evaluation)","G":"Magnet Exemplary Professional Practice (RN satisfaction categories), Structural Empowerment, Transformational Leadership · PTAP PBL 4, 6, 9 (professionalism, communication, interprofessional teaming) · NCPD EDP 1 (stakeholder input)","H":"Magnet New Knowledge, Innovations & Improvements · PTAP PC 5 (EBP / QI / research projects with interprofessional teams) · NCPD Standard 1 (valid, evidence-based content)","I":"Magnet Structural Empowerment (transition-to-practice programs) · PTAP PL 3, PG/OM 1, OE 1–3, DD 3–4, DD 9–12, PBL 1–10 · NCPD EDP 1","J":"Magnet Structural Empowerment (access to professional development) · PTAP DD 5, DD 7 (curriculum, faculty) · NCPD EDP 5–EDP 6 (assessment methods, active learning strategies) and QO 2 (operational improvement)","K":"Magnet Transformational Leadership (nurses’ input to strategic planning) · PTAP PL 6 (strategic planning) · NCPD SC 1 / QO 1 (expected results in knowledge, skill and practice)"},"q":[{"id":"Q1","sec":"A","title":"Unit (tick one)","req":true,"fields":[{"k":"radio","id":"unit","label":"Unit","options":["CSSD","ER","OPD","AICU","PICU","OR / DSU / PACU","EU","HDU","NICU","OBGYNE","L&D","FMSW","PW","MMSW","Home Care"],"other":true}],"help":{"means":"Which unit this form is for.","why":"NESD plans education per unit, and results are sent back to the right unit.","how":"Tick one unit. If yours is not listed, choose Other and type its name.","example":"A PICU Head Nurse ticks PICU.","mistakes":"Completing one form for two units. Each unit needs its own form."}},{"id":"Q2","sec":"A","title":"Completed by","req":true,"fields":[{"k":"multi","id":"src","label":"Input gathered from","options":["Unit-based council","Staff meeting","Preceptors","Unit CRN","Individual staff feedback"],"other":false},{"k":"text","id":"name","label":"Name","enh":false},{"k":"radio","id":"role","label":"Role","options":["Head Nurse","Unit CRN","Designee"],"other":true},{"k":"text","id":"contact","label":"Ext. / email","enh":false},{"k":"date","id":"date","label":"Date"}],"help":{"means":"Who filled in the form and whose input you used.","why":"NESD may need to contact you, and input from staff makes the answers more reliable.","how":"Tick every source you used, then enter your name, role, contact and today’s date.","example":"Head Nurse, input from the unit-based council and two preceptors."}},{"id":"Q3","sec":"A","title":"Nursing workforce in your unit (numbers as of today)","fields":[{"k":"rows","id":"wf","label":"Workforce","items":["Registered nurses (RN) — total","RNs with BSN or higher","RNs holding a national / specialty certification (e.g., MEDSURG-BC, PED-BC, NPD-BC, CCRN)","RNs applying for a certification exam in 2027 (incl. through ANCC Success Pays®)","RNs with \u003c 12 months since licensure (newly licensed, incl. Tamheer / interns)","RNs transferred into this unit in the last 12 months (new to the specialty)","Nurse technicians / nursing assistants","Preceptors: active","Preceptors: completed a preceptor course","Expected new hires or vacancies to fill in 2027"],"cols":[{"k":"number","id":"n","label":"Number","enh":false}],"always":true}],"help":{"means":"A headcount of your staff today.","why":"NESD uses these numbers to size classes and to work out percentages (for example, how many RNs hold a certification).","how":"Use your current roster, not estimates from memory. Write 0 where none apply.","example":"A ward with 20 RNs, 8 with a BSN, enters 20 and 8.","mistakes":"Counting a nurse in two rows that should not overlap. Entering a BSN number larger than total RNs."}},{"id":"Q4","sec":"A","title":"Shared governance in your unit","fields":[{"k":"radio","id":"council","label":"Unit-based council","options":["Active (meets at least monthly)","Being formed","None yet"],"other":false},{"k":"radio","id":"rep","label":"Unit representative on a hospital nursing council","options":["Yes","No"],"other":false}],"help":{"means":"Whether your unit has a staff council that takes part in decisions.","why":"Shared governance is a Magnet® requirement and shows whether staff have a voice.","how":"Pick the status that is true today.","example":"A council that meets monthly is \"Active\"."}},{"id":"Q5","sec":"B","title":"Clinical practice gaps in your unit","fields":[{"k":"table","id":"gaps","label":"One gap per row","cols":[{"k":"textarea","id":"gap","label":"Gap (problem or opportunity)","enh":false},{"k":"textarea","id":"cur","label":"Current practice","enh":true},{"k":"textarea","id":"exp","label":"Expected or required practice","enh":true},{"k":"radio","id":"type","label":"Type","options":["Procedure","Service","Equipment","Policy","Diagnosis","Other"],"other":false},{"k":"textarea","id":"evid","label":"Evidence that supports the gap (required)","enh":false},{"k":"radio","id":"need","label":"Underlying need","options":["K","S","P"],"other":false},{"k":"number","id":"staff","label":"Staff (#)","enh":false},{"k":"radio","id":"prio","label":"Priority","options":["H","M","L"],"other":false}],"min":1}],"help":{"means":"The difference between what happens now and what should happen, with proof.","why":"Education should be driven by evidence, not by requests. Every gap you list needs data behind it.","how":"One gap per entry. Describe today’s practice, the required practice, the evidence, the K/S/P need, the staff affected and the priority.","example":"Surgical ward: reassessment after pain medication is often not documented. Evidence: monthly audit shows 62% compliance. Need: P. Priority: H.","mistakes":"Writing \"staff requested training\" as evidence. Listing a staffing shortage as a knowledge gap when education will not fix it."}},{"id":"Q6","sec":"B","title":"Changes expected in 2027 that NESD should prepare for","fields":[{"k":"table","id":"chg","label":"New service, equipment, EHR module, unit expansion, change in patient population","cols":[{"k":"text","id":"what","label":"Change","enh":false},{"k":"date","id":"date","label":"Expected date"},{"k":"text","id":"lead","label":"Lead time needed","enh":false}],"min":0}],"help":{"means":"Changes coming in 2027 that will need staff training.","why":"NESD needs lead time to prepare classes before the change goes live.","how":"List each change with its expected date and how many weeks of preparation you need.","example":"A new infusion pump in the Medical Ward, expected March, 6 weeks of lead time."}},{"id":"Q7","sec":"C","title":"Role-based and mandatory courses required in your unit","fields":[{"k":"rows","id":"crs","label":"Tick the courses required","items":["BLS","ACLS","PALS","NRP","Trauma nursing (TNCC / ENPC / ATCN)","Electronic fetal monitoring","S.T.A.B.L.E. / neonatal stabilization","Moderate (procedural) sedation","Chemotherapy / hazardous drug administration","IV therapy, PIVC & blood transfusion","Infection prevention & control","Patient safety & CBAHI Essential Safety Requirements (ESR)","Other (name in Roles concerned) 1","Other (name in Roles concerned) 2"],"cols":[{"k":"text","id":"roles","label":"Roles concerned (RN, NT, charge nurse…)","enh":false},{"k":"number","id":"due","label":"# due in 2027","enh":false},{"k":"radio","id":"by","label":"Provided by","options":["NESD","External"],"other":false},{"k":"number","id":"cur","label":"Currently certified","enh":true},{"k":"number","id":"ren","label":"Requiring renewal","enh":true},{"k":"number","id":"ini","label":"Requiring initial","enh":true}],"always":false}],"help":{"means":"The courses your staff must hold for their role.","why":"It builds NESD’s mandatory training calendar and booking numbers.","how":"Tick each course your unit requires, say which roles need it, and enter how many staff are due for initial or renewal training in 2027.","example":"ER: if 8 of 20 nurses have an expired ACLS, enter 8 as the number due.","mistakes":"Entering your total staff instead of only those who are due. Leaving renewal and initial counts above the number due."}},{"id":"Q8","sec":"C","title":"Specialty certification and academic progression (Magnet goals)","fields":[{"k":"number","id":"elig","label":"a) Staff eligible and interested in sitting a certification exam in 2027","enh":false},{"k":"multi","id":"anc","label":"ANCC certifications through Success Pays®","options":["Medical-Surgical Nursing (MEDSURG-BC)","Pediatric Nursing (PED-BC)","Gerontological Nursing (GERO-BC)","Ambulatory Care Nursing (AMB-BC)","Cardiac-Vascular Nursing (CV-BC)","Pain Management Nursing (PMGT-BC)","Psychiatric-Mental Health Nursing (PMH-BC)","Nursing Case Management (CMGT-BC)","Informatics Nursing (NI-BC)","Nursing Professional Development (NPD-BC)","Nurse Executive (NE-BC)","Nurse Executive, Advanced (NEA-BC)","APRN: FNP-BC / AGACNP-BC / AGPCNP-BC / PMHNP-BC / AGCNS-BC"],"other":false},{"k":"multi","id":"oth","label":"Other specialty boards (not covered by Success Pays®)","options":["CCRN (critical care)","CEN (emergency)","CNOR (perioperative)","RNC-NIC (neonatal)","RNC-OB / C-EFM (obstetric)","CPAN / CAPA (perianesthesia)","CRNI (infusion)","CIC (infection control)"],"other":true},{"k":"multi","id":"bar","label":"b) Barriers to certification in your unit","options":["Exam fee","No preparation course","Study time / release time","English language","Exam access / test center","Unaware of eligibility","No recognition or incentive"],"other":true},{"k":"number","id":"bsn","label":"c) Staff currently enrolled in, or interested in, a BSN or higher degree","enh":false},{"k":"multi","id":"sup","label":"Support needed","options":["Study leave / flexible schedule","Academic advising","Scholarship information","English / academic writing support"],"other":false}],"help":{"means":"Specialty certifications your nurses want to sit, plus degree plans.","why":"Certification and BSN rates are Magnet® goals, and Success Pays® can cover the ANCC exam fee only when the nurse passes.","how":"Enter how many are eligible and interested, tick the certifications, then the barriers and support needed.","example":"PICU: 3 nurses interested in PED-BC; barrier: no preparation course.","mistakes":"Ticking a non-ANCC certification (such as CCRN) and expecting Success Pays® to cover it."}},{"id":"Q9","sec":"C","title":"Role-based development needed in your unit","fields":[{"k":"rows","id":"role","label":"Tick the role and write the number of staff","items":["Charge nurse development","Preceptor course (initial)","Preceptor refresher","Mentor training","Unit CRN development (teaching, coaching, audit)","Unit council chair / shared governance leaders","Case management / discharge planning nurse","Patient and family educator (e.g., diabetes, maternal)","Head nurse / assistant head nurse development","Nursing supervisor (shift / nursing office) development","Staff nurse advancement (clinical ladder, portfolio)","Nurse technician development (skills and scope)","Infection control link nurse","Quality and patient safety link nurse","Wound care / pressure injury link nurse","Nursing informatics / EHR super-user","Other (specify in Comments) 1","Other (specify in Comments) 2"],"cols":[{"k":"number","id":"n","label":"# staff","enh":false},{"k":"text","id":"c","label":"Comments","enh":false}],"always":false}],"help":{"means":"Leadership and specialty roles where staff need development.","why":"NESD plans courses for roles such as charge nurse and preceptor.","how":"Tick each role and enter how many staff need it.","example":"OR: 2 staff need the initial preceptor course."}},{"id":"Q10","sec":"D","title":"After reviewing your unit competency list, identify the competencies that need attention in 2027","fields":[{"k":"table","id":"comp","label":"HRLV = high-risk / low-volume · PP = problem-prone · TS = time-sensitive / critical · N = new","cols":[{"k":"text","id":"name","label":"Competency","enh":false},{"k":"multi","id":"cat","label":"Category","options":["HRLV","PP","TS","N"],"other":false},{"k":"text","id":"meth","label":"Current validation method","enh":false},{"k":"date","id":"last","label":"Last validated"},{"k":"multi","id":"act","label":"Action needed","options":["Annual","Simulation","Retrain"],"other":false},{"k":"textarea","id":"why","label":"Reason for selection","enh":true},{"k":"number","id":"staff","label":"Employees affected","enh":true},{"k":"textarea","id":"cm","label":"Comments","enh":true}],"min":1}],"help":{"means":"Skills that need extra attention next year. HRLV: rarely done but high harm. PP: errors happen often. TS: must be done fast. N: new.","why":"High-risk and error-prone skills should be validated first.","how":"List each competency, pick its category, say how it is checked now and when it was last checked, and what you need.","example":"Pediatric ward: pediatric code response is HRLV; last validated 10 months ago; needs simulation.","mistakes":"Listing every competency. Pick only the ones that need attention."}},{"id":"Q11","sec":"D","title":"New competencies added to your unit in 2026 (or needed in 2027)","fields":[{"k":"table","id":"newc","label":"New competencies","cols":[{"k":"text","id":"c","label":"New competency","enh":false},{"k":"text","id":"trig","label":"Trigger (new equipment / procedure / policy)","enh":false},{"k":"number","id":"n","label":"Staff to validate (#)","enh":false},{"k":"date","id":"date","label":"Target date"}],"min":0}],"help":{"means":"New skills that staff must prove because of new equipment, procedures or policies.","why":"NESD must schedule validation before go-live.","how":"Name the competency, what triggered it, how many staff and the target date.","example":"CSSD: a new sterilizer, 12 staff, target April."}},{"id":"Q12","sec":"D","title":"Preferred competency validation methods and timing for your unit","fields":[{"k":"multi","id":"meth","label":"Methods","options":["Return demonstration","Simulation","Case review / chart audit","Observation in practice","Peer review","Written test","Self-assessment with evidence"],"other":true},{"k":"radio","id":"qtr","label":"Annual competency day — preferred quarter","options":["Q1","Q2","Q3","Q4"],"other":false},{"k":"radio","id":"fmt","label":"Preferred format","options":["Skills fair","Unit-based validation","E-learning + skills lab","Blended"],"other":false}],"help":{"means":"How you want staff skills to be checked, and when.","why":"It lets NESD fit validation into your workload.","how":"Tick your preferred methods, one quarter and one format.","example":"Simulation and return demonstration, Q2, unit-based."}},{"id":"Q13","sec":"E","title":"Educational challenges that hinder nursing documentation in your unit","fields":[{"k":"multi","id":"ch","label":"Tick all that apply","options":["EHR navigation / templates","Nursing assessment & reassessment","Nursing care plan","Pain assessment & reassessment","Fall risk & pressure injury (Braden) documentation","Restraint documentation","Medication administration record","Blood transfusion documentation","Handover / SBAR documentation","Patient & family education record","Discharge documentation","Incident (OVR) reporting","Consent & legal forms","Timeliness / late entries","Abbreviations & terminology"],"other":true},{"k":"multi","id":"root","label":"Root cause (tick all)","options":["Knowledge — do not know what to document","Skill — do not know how to do it in the EHR","Practice — know how, but not done (workload, culture)"],"other":false},{"k":"multi","id":"ev","label":"Evidence","options":["Documentation audit","OVRs","Peer review","Accreditation finding"],"other":true},{"k":"number","id":"aud","label":"Documentation audit compliance (%)","enh":false},{"k":"textarea","id":"det","label":"Details / examples","enh":false},{"k":"textarea","id":"int","label":"Suggested educational intervention","enh":true}],"help":{"means":"Where documentation problems come from, and the proof.","why":"Documentation gaps are common, but the cause decides the fix. Knowledge and skill gaps need education; practice gaps may not.","how":"Tick the problem areas, the root cause and the evidence. Enter the audit result if you have one.","example":"ICU: nursing reassessment is missed. Evidence: audit 70%. Cause: practice (workload).","mistakes":"Choosing a cause without any evidence."}},{"id":"Q14","sec":"E","title":"Legal, ethical and regulatory topics needed","fields":[{"k":"rows","id":"leg","label":"Tick and write the number of staff","items":["Nursing scope & standards of practice (SCFHS / ANA)","Legal aspects of nursing documentation","Informed consent","Patient rights, privacy & confidentiality","Code of ethics & ethical decision-making","Workplace violence prevention","CBAHI Essential Safety Requirements (ESR)","Accreditation survey readiness (CBAHI / JCI)","Medication safety & high-alert medications","Delegation & supervision of nurse technicians","Incident reporting & just culture","Other (specify in Comments)"],"cols":[{"k":"number","id":"n","label":"# staff","enh":false},{"k":"text","id":"c","label":"Comments","enh":false}],"always":false}],"help":{"means":"Legal, ethical and regulatory topics staff need.","why":"They support accreditation readiness and safe practice.","how":"Tick each topic and enter how many staff need it.","example":"ER: 15 staff need incident reporting and just culture."}},{"id":"Q15","sec":"F","title":"Unit nurse-sensitive indicators (NDNQI) — where does an educational gap contribute?","fields":[{"k":"rows","id":"ind","label":"Use the latest dashboard","items":["Patient falls with injury","Hospital-acquired pressure injury (stage 2 and above)","CLABSI","CAUTI","VAE / VAP","Restraint prevalence","Medication errors with harm","Hand hygiene compliance","Pediatric PIV infiltration","Unit-specific indicator 1 (name in Topic)","Unit-specific indicator 2 (name in Topic)"],"cols":[{"k":"radio","id":"pos","label":"Unit vs benchmark","options":["Outperforms","At","Below","N/A"],"other":false},{"k":"radio","id":"edu","label":"Education-related factor?","options":["Yes","No"],"other":false},{"k":"text","id":"topic","label":"Topic / skill needed","enh":false},{"k":"text","id":"cur","label":"Current performance","enh":true},{"k":"text","id":"tgt","label":"Target","enh":true},{"k":"text","id":"meas","label":"How improvement will be measured","enh":true}],"always":true}],"help":{"means":"How your unit compares with benchmark on nurse-sensitive indicators, and whether education is part of the reason.","why":"A poor result does not always mean a training problem. It may be a staffing, equipment or process problem.","how":"Use the latest dashboard. Mark your position and answer honestly whether a knowledge, skill or practice gap contributes. If yes, name the topic.","example":"Medical Ward: falls with injury are below benchmark; staff do not apply the fall-risk interventions. Education: Yes. Topic: fall risk reassessment.","mistakes":"Answering \"Yes\" for every indicator below benchmark."}},{"id":"Q16","sec":"F","title":"Quality-improvement capability — education needed for","fields":[{"k":"multi","id":"qi","label":"Tick all that apply","options":["Reading the NDNQI / unit dashboard","PDSA and QI methodology","Root cause analysis (RCA)","Audit tools & data collection","Presenting data (run / control charts)","Writing an improvement story / exemplar"],"other":true},{"k":"textarea","id":"proj","label":"Current unit QI project(s) and the support needed","enh":false}],"help":{"means":"Quality improvement skills your staff need.","why":"Staff who can read data and run improvement cycles solve problems on their own.","how":"Tick the skills, then describe any QI project you are running.","example":"Unit wants to learn PDSA for a hand hygiene project."}},{"id":"Q17","sec":"F","title":"Impact of education in the last 12 months (summative evaluation)","fields":[{"k":"table","id":"imp","label":"Education that changed practice or an outcome","cols":[{"k":"text","id":"act","label":"Education activity","enh":false},{"k":"text","id":"meas","label":"Practice / outcome measure","enh":false},{"k":"text","id":"b","label":"Before","enh":false},{"k":"text","id":"a","label":"After","enh":false},{"k":"text","id":"src","label":"Evidence source","enh":false}],"min":0},{"k":"textarea","id":"no","label":"Activities that did not lead to a change in practice, and why","enh":false}],"help":{"means":"Education from the last 12 months that really changed something.","why":"It shows whether past training worked. Accreditation needs outcomes, not attendance.","how":"List each activity with the measure, the before and after values and where the data came from.","example":"Hand hygiene teach-back; compliance audit rose from 71% to 88%.","mistakes":"Reporting attendance numbers instead of a change in practice."}},{"id":"Q18","sec":"G","title":"Common issues identified in staff annual appraisals","fields":[{"k":"rows","id":"app","label":"Tick and estimate the number of staff","items":["Communication (verbal / written)","Medical terminology","Email & professional writing","English language","Teamwork & conflict resolution","Delegation & supervision","Time management & prioritization","Critical thinking & clinical judgment","Use of evidence (EBP)","Infection control practice","Patient / family education skills","Professional behavior & accountability","Customer service / patient experience","Technology / EHR proficiency","Other (specify in Comments)"],"cols":[{"k":"number","id":"n","label":"# staff","enh":false},{"k":"text","id":"c","label":"Comments","enh":false}],"always":false}],"help":{"means":"Problems that keep showing up in staff yearly appraisals.","why":"Repeated appraisal findings point to development needs.","how":"Tick each issue and estimate how many staff are affected.","example":"Medical Ward: 6 staff have time-management findings."}},{"id":"Q19","sec":"G","title":"RN satisfaction action plan — RN–RN and RN–physician interaction and communication","fields":[{"k":"textarea","id":"ch","label":"Describe the challenges in your unit and the education you suggest","enh":false},{"k":"multi","id":"edu","label":"Suggested education","options":["TeamSTEPPS / team training","SBAR & escalation (CUS)","Assertive communication","Conflict management","Civility & respectful workplace","Interprofessional rounds","Joint RN–physician simulation"],"other":false}],"help":{"means":"Communication problems between nurses, or between nurses and doctors.","why":"RN satisfaction results include communication, and training can help.","how":"Describe the problem, then tick the education you think would help.","example":"Critical results are reported late to the doctor. Suggested: SBAR and escalation training."}},{"id":"Q20","sec":"G","title":"Magnet RN survey categories — rate your unit today and tick where education would help","fields":[{"k":"rows","id":"mag","label":"1 = major concern · 2 = needs improvement · 3 = acceptable · 4 = strength","items":["Adequacy of resources and staffing","Autonomy","Fundamentals of quality nursing care","Interprofessional relationships","Leadership access and responsiveness","Professional development","RN-to-RN teamwork and collaboration"],"cols":[{"k":"radio","id":"r","label":"Rating (1-4)","options":["1","2","3","4"],"other":false},{"k":"multi","id":"h","label":"Education","options":["Education would help"],"other":false}],"always":true}],"help":{"means":"Your own rating of seven areas covered by the Magnet® RN survey.","why":"It shows where staff experience is weak, and where education could help.","how":"Rate each from 1 (major concern) to 4 (strength). Tick \"Education would help\" only if education is part of the solution.","example":"Staffing rated 2, with no education tick, because training will not add staff."}},{"id":"Q21","sec":"G","title":"Shared governance and professional practice — staff need education on","fields":[{"k":"multi","id":"sg","label":"Tick all that apply","options":["What shared governance is / the councilor model","Running an effective unit council","SFHD Nursing Professional Practice Model","Our care delivery model","Magnet® components and our journey","Peer feedback & peer review","Writing exemplars / sharing unit stories"],"other":true},{"k":"textarea","id":"ask","label":"Topics staff themselves asked for this year","enh":false}],"help":{"means":"What staff need to know about shared governance and professional practice.","why":"It supports Magnet® journey readiness.","how":"Tick the topics and add anything staff asked for themselves.","example":"Staff ask how to run a unit council meeting."}},{"id":"Q22","sec":"H","title":"Rate your staff’s current ability and tick where education is needed","fields":[{"k":"rows","id":"ebp","label":"1 = low · 2 = basic · 3 = competent · 4 = strong","items":["Ask a focused clinical question (PICO)","Search databases (CINAHL, PubMed, guidelines)","Appraise the quality of evidence","Implement a practice change","Evaluate outcomes of a change","Disseminate (poster, presentation, publication)"],"cols":[{"k":"radio","id":"r","label":"Rating (1-4)","options":["1","2","3","4"],"other":false},{"k":"multi","id":"h","label":"Education","options":["Education would help"],"other":false}],"always":true}],"help":{"means":"How well staff can use evidence in practice, step by step.","why":"It guides EBP training. PICO means a structured clinical question.","how":"Rate each step from 1 (low) to 4 (strong) and tick where training is needed.","example":"PICO example: in adult ICU patients, does a pressure injury bundle compared with usual care reduce hospital-acquired pressure injuries?"}},{"id":"Q23","sec":"H","title":"EBP, research and innovation in your unit","fields":[{"k":"textarea","id":"proj","label":"a) Current or planned EBP / research / innovation projects","enh":false},{"k":"multi","id":"sup","label":"b) Support needed","options":["EBP mentor / facilitator","Journal club","Library & database access","Statistics / data analysis","IRB / research ethics process","Writing abstracts & posters","Innovation / technology ideas","Protected time"],"other":true},{"k":"textarea","id":"idea","label":"c) One innovation idea that would improve care or work in your unit","enh":false}],"help":{"means":"Research or improvement projects in your unit and the help they need.","why":"NESD can offer mentoring and support.","how":"Describe projects, tick support, and share one idea.","example":"OR: a project on reducing turnover time, needing a statistics helper."}},{"id":"Q24","sec":"I","title":"Learner pipeline and orientation","fields":[{"k":"rows","id":"pipe","label":"Numbers","items":["Newly licensed RNs expected to start in 2027 (incl. Tamheer trainees / interns)","Experienced RNs expected to transfer into this specialty in 2027 (fellowship-type learners)","Learners currently in orientation / residency in the unit","Nurse technicians expected to start in 2027","Typical unit orientation length for a new graduate (weeks)"],"cols":[{"k":"number","id":"n","label":"Number","enh":false}],"always":true},{"k":"radio","id":"adq","label":"Is the current orientation length adequate?","options":["Yes","No"],"other":false},{"k":"number","id":"wk","label":"If No — recommended length (weeks)","enh":false}],"help":{"means":"How many new learners are coming and how long orientation takes.","why":"It sets the size of the residency and orientation program.","how":"Enter expected numbers. Say whether the orientation length is enough, and if not, the length you recommend.","example":"NICU: 4 new graduates expected; orientation is 12 weeks; recommended 16."}},{"id":"Q25","sec":"I","title":"Preceptor capacity and development","fields":[{"k":"rows","id":"pc","label":"Numbers","items":["Active preceptors in the unit","Preceptors who have completed the preceptor course","Preceptors who need the initial course or a refresher in 2027"],"cols":[{"k":"number","id":"n","label":"Number","enh":false}],"always":true},{"k":"radio","id":"crit","label":"Preceptors are selected against written criteria","options":["Yes","No"],"other":false},{"k":"radio","id":"evl","label":"Preceptors are formally evaluated (by learner, by head nurse / educator)","options":["Yes","No"],"other":false},{"k":"multi","id":"dev","label":"Preceptor development needs","options":["Adult learning & coaching","Giving formative & summative feedback","Assessing & validating competency","Identifying & remediating a competency gap","Managing a struggling learner","Cultural & language considerations","Preceptor well-being & workload","Documenting learner progress"],"other":true}],"help":{"means":"Whether you have enough trained preceptors.","why":"Accredited transition programs need prepared, evaluated preceptors.","how":"Enter your numbers, answer the two Yes/No questions and tick development needs.","example":"6 new hires and 2 preceptors: capacity is not sufficient.","mistakes":"Counting preceptors who have not completed the course as trained."}},{"id":"Q26","sec":"I","title":"Competency gaps commonly observed in new graduates at the end of orientation","fields":[{"k":"multi","id":"gap","label":"Tick all that apply","options":["Clinical reasoning / recognizing deterioration","Prioritization & time management","Medication administration & calculations","Documentation","Communication with physicians & families","Delegation to nurse technicians","Emergency response / code participation","Professionalism & accountability"],"other":true},{"k":"text","id":"unit","label":"Unit-specific skills","enh":false},{"k":"multi","id":"rem","label":"Remediation currently used","options":["Extended precepted time","Skills lab","Individual learning plan","Simulation","None formal"],"other":false}],"help":{"means":"Skills new graduates still lack when orientation ends.","why":"It shows where orientation should change.","how":"Tick the gaps you really observe and the remediation you use now.","example":"ER: recognizing deterioration and emergency response."}},{"id":"Q27","sec":"I","title":"PTAP practice-based learning concepts — how well does the unit integrate each for learners today?","fields":[{"k":"rows","id":"ptap","label":"1 = not addressed · 2 = informal · 3 = structured · 4 = structured and evaluated","items":["Mentorship (beyond the preceptor)","Peer support among learners","Learner well-being","Professionalism","Time management","Communication","Critical thinking","Ethics","Interprofessional teaming","Social determinants of health / patient context"],"cols":[{
